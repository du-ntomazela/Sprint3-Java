spring.application.name=SpecRadar

server.port=8080
server.error.include-stacktrace=never
server.error.include-message=never

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:specradar}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

spring.flyway.enabled=true

api.security.token.secret=${JWT_SECRET}

api.security.allowed-origins=${ALLOWED_ORIGINS:http://localhost:5500,http://127.0.0.1:5500}

specradar.ml.url=${ML_URL:http://localhost:8000}
specradar.ml.timeout-ms=${ML_TIMEOUT_MS:5000}

specradar.seed.admin-login=${ADMIN_LOGIN:admin@specradar.com}
specradar.seed.admin-password=${ADMIN_PASSWORD}
specradar.seed.analista-login=${ANALISTA_LOGIN:analista@specradar.com}
specradar.seed.analista-password=${ANALISTA_PASSWORD}
specradar.seed.ranger-raptor-path=${RANGER_RAPTOR_PATH:dados/ranger-raptor.json}

management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.show-details=never
management.prometheus.metrics.export.enabled=true

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
